name: shine_express_app
description: Shine Express customer & staff app (Android + iOS) — PHP/MySQL backend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.2
  provider: ^6.1.1
  go_router: ^13.2.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3
  image_picker: ^1.0.7
  url_launcher: ^6.2.4
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
